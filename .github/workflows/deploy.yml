name: Deploy

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/xpacio/xpacio-backend

            echo "=== Pull latest ==="
            git pull origin develop

            echo "=== Build services ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod build frontend api worker beat

            echo "=== Rolling restart ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps frontend api worker beat

            echo "=== Wait for health ==="
            for i in $(seq 1 18); do
              STATUS=$(docker compose -f docker-compose.prod.yml ps api --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['Health'] if d else 'unknown')" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "API healthy after ${i}0s"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "API never became healthy — deploy may have failed"
                docker compose -f docker-compose.prod.yml logs api --tail=50
                exit 1
              fi
              sleep 10
            done

            echo "=== Deploy completo ==="
            docker compose -f docker-compose.prod.yml ps
