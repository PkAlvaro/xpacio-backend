name: Deploy

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/deploy/xpacio/xpacio-backend

            echo "=== Pull latest ==="
            git pull origin develop

            echo "=== Build services ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod build frontend api worker beat

            echo "=== Rolling restart ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps frontend api worker beat

            echo "=== Wait for health ==="
            for i in $(seq 1 18); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "API healthy after ${i}0s"
                break
              fi
              echo "  [${i}] waiting..."
              if [ "$i" -eq 18 ]; then
                echo "API never became healthy — deploy failed"
                docker compose -f docker-compose.prod.yml logs api --tail=50
                exit 1
              fi
              sleep 10
            done

            echo "=== Reload nginx ==="
            docker exec xpacio-backend-nginx-1 nginx -s reload 2>/dev/null || true

            echo "=== Deploy completo ==="
            docker compose -f docker-compose.prod.yml ps
