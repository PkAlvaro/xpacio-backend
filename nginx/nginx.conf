upstream api {
    server api:8000;
}

upstream frontend {
    server frontend:3000;
}

upstream minio {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://images.unsplash.com; connect-src 'self' https://*.googleapis.com https://maps.gstatic.com; worker-src blob:; frame-src 'none'; object-src 'none'; base-uri 'self';" always;

    # API — proxy al backend
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MinIO storage — imágenes subidas
    location /storage/ {
        proxy_pass http://minio/xpacio-spaces/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000";
    }

    # FastAPI docs y health
    location /health {
        proxy_pass http://api/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://api/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend SPA — todo lo demas
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
